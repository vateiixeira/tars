name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validar versão e origem da tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          if [[ "$IS_TAG" == "true" ]]; then
            version=$(python3 scripts/release.py check --tag "$RELEASE_TAG")
            git merge-base --is-ancestor HEAD origin/main
          else
            version=$(python3 scripts/release.py check)
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
  build:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/package.json
      - name: Dependências do Tauri
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev build-essential libxdo-dev libssl-dev
          librsvg2-dev libayatana-appindicator3-dev
      - run: rustup update stable --no-self-update && rustup default stable
      - run: pnpm install --frozen-lockfile
        working-directory: app
      - run: pnpm tauri build --no-bundle -- --locked
        working-directory: app
      - name: Montar e conferir o pacote Linux
        run: |
          python3 scripts/release.py package
          cd dist-release
          sha256sum -c SHA256SUMS
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: tars-${{ needs.validate.outputs.version }}-linux-x86_64
          path: dist-release/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0
  publish:
    needs: [validate, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: tars-${{ needs.validate.outputs.version }}-linux-x86_64
          path: dist-release
      - name: Publicar release com os arquivos verificados
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist-release
          sha256sum -c SHA256SUMS
          draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null || true)
          if [[ "$draft" == "false" ]]; then
            echo "::error::Essa versão já foi publicada. Prepare uma nova versão."
            exit 1
          fi
          if [[ "$draft" != "true" ]]; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --generate-notes \
              --title "TARS $RELEASE_TAG" \
              --notes 'Pacote Linux x86_64 com app e backend Python. Veja docs/INSTALL_RELEASE.md dentro do pacote. Requer Python, uv, GPU NVIDIA e dependências Linux; modelos são baixados no primeiro uso. Separação de falantes local por padrão; pyannote opcional (extra).'
          fi
          gh release upload "$RELEASE_TAG" ./*.tar.gz SHA256SUMS --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest
