[project]
name = "whisper-ditado"
version = "0.3.1"
description = "TARS: ditado por voz, reuniões e criação de issues"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Vinicius Alexandre" }]
requires-python = ">=3.12"
dependencies = [
    "evdev>=2.0.0",
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.8",
    "nvidia-cudnn-cu12==9.*",
    "fastapi",
    "uvicorn",
    "sherpa-onnx>=2.0.1,<3",
    "websockets>=17.3",
    "jeepney>=0.9.0",
    "pillow>=13.0.0",
]

[project.optional-dependencies]
pyannote = ["pyannote.audio>=4.0,<5", "torch", "torchaudio"]

[project.urls]
Repository = "https://github.com/vateiixeira/tars"
Issues = "https://github.com/vateiixeira/tars/issues"

[dependency-groups]
dev = [
    "pytest",
    "httpx",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/whisper_ditado"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not gpu and not models'"
markers = [
    "gpu: testes que usam a GPU (rodar com -m gpu)",
    "models: testes que baixam e usam os modelos reais do sherpa-onnx (rodar com -m models)",
]
